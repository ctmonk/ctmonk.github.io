<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title description">
<title id="title">GATE — flock tracking and acoustic telemetry</title>
<desc id="description">GATE wordmark with a T formed from five receiver points and two broken acoustic rings around each one. Three solid flock triangles above the A connect to three neatly spaced tracks with rounded right-angle turns. The tracks form the horizontal crossbar and vertical stem of the T behind the five receivers. Tracking corners surround the wordmark. Black vector artwork, native letter proportions, outlined type and transparent background.</desc>
